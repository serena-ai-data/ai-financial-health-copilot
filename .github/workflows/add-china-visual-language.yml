name: Add China-first visual language rationale
on:
  push:
    paths:
      - '.github/workflows/add-china-visual-language.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch neobank portfolio
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('neobank/index.html')
          s = p.read_text(encoding='utf-8')
          css = '''.visualLanguage{margin-top:34px;padding-top:30px;border-top:1px solid var(--line)}.visualLanguageHead{display:grid;grid-template-columns:180px 1fr;gap:44px;align-items:start;margin-bottom:20px}.visualLanguageHead h3{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.1;margin:0 0 8px}.visualLanguageHead p{margin:0;color:var(--muted);max-width:820px}.visualCards{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:#fff}.visualCard{padding:22px;min-height:175px;border-right:1px solid var(--line)}.visualCard:last-child{border-right:0}.swatch{width:40px;height:40px;border-radius:50%;margin-bottom:16px;border:1px solid rgba(0,0,0,.06)}.swatch.red{background:var(--red)}.swatch.ivory{background:var(--paper);border-color:#dccdbc}.swatch.gold{background:var(--gold)}.visualCard h4{font-family:Georgia,serif;font-size:20px;margin:0 0 7px}.visualCard p{margin:0;color:var(--muted);font-size:14px}.visualNote{margin-top:16px;padding:16px 18px;background:#f2e4d7;border-left:3px solid var(--red);color:#66574f;font-size:14px}.visualNote b{color:var(--red3)}\n'''
          css_marker = '.footer{background:#321014'
          if 'visualLanguage{' not in s:
              if css_marker not in s:
                  raise SystemExit('CSS insertion marker not found')
              s = s.replace(css_marker, css + css_marker, 1)
          mobile_old = '@media(max-width:980px){.heroInner,.sectionHead,.problemLayout,.prototypeShowcase,.metricLedger,.evidence{grid-template-columns:1fr}'
          mobile_new = '@media(max-width:980px){.heroInner,.sectionHead,.problemLayout,.prototypeShowcase,.metricLedger,.evidence,.visualLanguageHead{grid-template-columns:1fr}.visualCards{grid-template-columns:1fr}.visualCard{border-right:0;border-bottom:1px solid var(--line)}.visualCard:last-child{border-bottom:0}'
          s = s.replace(mobile_old, mobile_new, 1)
          insert_marker = '</div></div></div></section>\n\n<section class="section" id="thesis">'
          module = '''</div></div><div class="visualLanguage"><div class="visualLanguageHead"><div><div class="eyebrow">China-first visual language</div></div><div><h3>Local familiarity without copying an existing bank.</h3><p>The red-led palette is a deliberate localisation hypothesis rather than decoration. Red carries familiar positive and high-salience associations in China and appears across parts of Chinese financial branding. The interface pairs it with warm ivory and restrained gold so the product feels locally recognisable, trustworthy and premium without becoming festive or overly promotional.</p></div></div><div class="visualCards"><div class="visualCard"><div class="swatch red"></div><h4>Deep red</h4><p>Creates immediate salience and a familiar China-market financial cue while reserving the strongest colour for priority states and decisive actions.</p></div><div class="visualCard"><div class="swatch ivory"></div><h4>Warm ivory</h4><p>Softens the intensity of red, improves reading comfort and keeps dense financial information calm rather than sales-led.</p></div><div class="visualCard"><div class="swatch gold"></div><h4>Restrained gold</h4><p>Adds a premium accent sparingly for hierarchy and emphasis without turning the interface into an ornamental or festive visual system.</p></div></div><div class="visualNote"><b>Design principle:</b> locally recognisable, not imitative. Colour supports trust and product hierarchy; it does not substitute for user research, usability testing or evidence about individual preferences.</div></div></div></section>\n\n<section class="section" id="thesis">'''
          if 'China-first visual language' not in s:
              if insert_marker not in s:
                  raise SystemExit('HTML insertion marker not found')
              s = s.replace(insert_marker, module, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neobank/index.html
          git diff --cached --quiet || git commit -m "Add China-first visual language rationale"
          git push
